<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      * {
        height: 100%; /* Faz com que o gradiente ocupe toda a tela */
      }
      body {
        background-image: linear-gradient(
          to bottom,
          #e4d5d5,
          #529886,
          #303eb8,
          #07079a
        );
        /*to bottom, to top, to left, to right, to bottom right, to bottom left, to top right, to top left*/
        background-attachment: fixed; /* Faz com que o gradiente fique fixo ao rolar a página */
      }
    </style>

    <title>Gradiente em CSS</title>
  </head>
  <body>
    <h1>Testando Gradientes</h1>
  </body>
</html>
