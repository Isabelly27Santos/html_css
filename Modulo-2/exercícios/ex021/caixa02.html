<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grouping Tags</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
        }
        header {
            background-color: #333;
            color: #fff;
            padding: 20px;
            margin: 10px;
        }
        main {
            background-color: #d3cbcb;
            padding: 20px;
            margin: 10px;
        }
        article {
            background-color: white;
            padding: 15px;
            margin: 10px 0;
        } 
        footer {
            background-color: #333;
            color: #fff;
            padding: 1px;
            margin: 10px;
            text-align: center;
        }
    </style>
</head>
<body>
    <header> <!-- Cabeçalho do site -->
        <h1>Meu Site</h1>
        <nav> <!-- Menu de navegação -->
            <a href="">Início</a>
            <a href="">Sobre</a>
            <a href="">Contato</a>
            <a href="">Blog</a>
            <a href="">FAQ</a>
        </nav> 
    </header>
    <main> <!-- Conteúdo principal -->
        <section id = "Assuntos"> <!-- Seção de assuntos -->
        </section>
        <section id = "Noticias"> <!-- Seção de notícias -->
            <article> <!-- Artigo de notícia -->
                <h2>Notícia 1</h2>
                <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed euismod, nunc ut laoreet tincidunt, nunc nisl aliquam nunc, eget aliquam nunc nisl eget nunc.</p>
                <aside> <!-- Informações adicionais -->
                    <p>Informações adicionais sobre a notícia 1.</p>
                </aside>
            </article>
            
        </section>
    </main>
    <footer> <!-- Rodapé do site -->
        <p>Todos os direitos reservados</p>
    </footer>
</body>
</html>
