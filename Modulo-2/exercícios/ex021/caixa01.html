<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        h1{ /*box-level*/
            height: 90px;
            width: 420px;
            background-color: rgb(178, 222, 213);
            border-width: 10px;
            border-style: solid;
            border-color: rgb(152, 141, 141);

            padding-top: 10px;
            padding-bottom: 10px;
            padding-left: 10px;
            padding-right: 10px;

            margin: auto; /*centraliza o elemento automaticamente*/
            margin-top: 20px;

            outline-width: 3px;
            outline-style: dashed;
            outline-color: rgb(35, 202, 80);
        }

        h2 {
            border: 5px solid rgb(30, 145, 76);
            padding: 10px; /*top, right, bottom, left, ou só 1 valor se for igual em todos os lados*/
            margin: 20px auto 40px auto; 
            width: 400px;
        }

        a { /*inline-level*/
            border-width: 3px;
            border-style: solid;  /*solid, dashed, dotted, double, groove, ridge, inset, outset*/
            border-color: rgb(160, 74, 74);
            padding: 2px 10px; /*coloca o padding em cima e embaixo 2px, e nas laterais 10px*/
        }
        .link {
            display: block; /*transforma o link em box-level*/
            width: 100px;
            text-align: center;
            margin: 20px auto;
            background-color: rgb(178, 222, 213);
            border-color: rgb(33, 51, 154);
        }
    </style>
    <title>Modelo de Caixas</title>
</head>
<body>
    <h1>Exemplo de caixa box-level</h1>
    <h2>Segundo Exemplo</h2>
    <p>Parágrafos são exemplos de box-level, mas os <a href="#">links</a> são exemplos de caixa inline. Vamos ver como tudo isso funciona.</p>

    <a class = "link" href="#">link</a>

    <img src="box.png" alt="box">
</body>
</html>
