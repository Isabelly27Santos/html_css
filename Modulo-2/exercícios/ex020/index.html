<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style> 
    div {
        display: inline-block; /* exibe os elementos em linha */
        background-color: lightblue;
        border: 1px solid black; /* borda */
        text-align: center;
        height: 200px;  /* altura */
        width: 200px;  /* largura */
    }
    div:hover {
        background-color: lightgreen; /* muda a cor de fundo quando o mouse passa por cima */
    }
    </style>
    <title>Pseudo-Classes</title>
</head>
<body>
    <div id = "d1">01</div>
    <div id = "d2">02</div>
    <div id = "d3">03</div>
</body>
</html>
