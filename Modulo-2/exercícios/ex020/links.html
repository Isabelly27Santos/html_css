<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links</title>

    <!-- SELETORES PERSONALIZADOS
     # = id    - só pode usar um com mesmo nome na página
     . = class  - pode usar várias com mesmo nome na página
     : = pseudo-classe
     :: = pseudo-elemento
     > = descendente (children)   
    
    -->
    <style>
        body{
            font-family: Arial, sans-serif;
        }
        a {
            color: rgb(20, 170, 82);
            text-decoration: none;  /* Remove o sublinhado do link */
            font: bold 19px Arial, sans-serif;
        }
        a:visited {  /* Pseudo-classe visited */
            color: rgb(20, 82, 170);
        }
        a:hover {  /* Pseudo-classe hover */
            text-decoration: underline; 
            color: black;
        }
        a:active {  /* Pseudo-classe active, muda cor ao selecionar */
            color: rgb(230, 214, 179);  
        }
        a::after {  /* Pseudo-elemento after, adiciona um ícone após o link */
            content: " [link]";  
            text-decoration: none;
            font-weight: normal;
            color:gray;
        }

        .especial {
            background-color: rgb(255, 245, 190);
        }
        .especial::after {  
            content: " ⇐";  
            text-decoration: none;
            font-weight: bolder;
            color:rgb(230, 29, 29)
        }
        .especial::before {  
            content: "⇒ ";  
            text-decoration: none;
            font-weight: bolder;
            color:rgb(230, 29, 29)
        }
    </style>
</head>
<body>
    <h1>Pesonalizando Links</h1>
    <ul>
        <li><a href="https://github.com/Isabelly27Santos/html_css" target="_blank">Repositório GitHub</a></li>
        <li><a href="https://www.youtube.com/@cursoemvideo" class = "especial">Canal do YouTube</a></li>
        <li><a href="https://www.cursoemvideo.com" class = "especial">Site do CursoEmVídeo</a></li>
    </ul>
</body>
</html>
