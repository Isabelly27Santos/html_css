<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        div:hover {  /* Pseudo-classe hover */
            color: red;
        }
        div > p {
            display: none; /* Esconde o parágrafo inicialmente */
        }
        div:hover > p {
            display: block; /* Mostra o parágrafo quando o mouse passa por cima do div */
            font: bold 19px Arial, sans-serif;
            background-color: rgb(186, 100, 114);
            color: white;
            width: 210px;
        }
    </style>
    <title>Exemplo de Hover</title>
</head>
<body>
    <h1>Exemplo de Hover</h1>
    <p>Passe o mouse sobre o texto abaixo para ver a mudança de cor.</p>
    <div>
        Passe o mouse aqui!
        <p>TEXTO ESCONDIDO...</p>
    </div>
</body>
</html>
