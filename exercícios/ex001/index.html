


<!DOCTYPE html>   <!-- Define que o HTML usado será o HTML5 -->
<html lang="pt-br">  <!--Indica o idioma do site-->
<head>
    <meta charset="UTF-8">  <!--Permite que o site exiba caracteres com acentuação-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">  <!--Indica que o site vai ocupar 100% da tela do navegador-->
    <title>Meu Primeiro Exercício</title>  <!--Nome do cabeçalho do site-->
</head>
<body>
    <h1>Olá, Mundo!</h1>  <!--Título do site de nível 1-->
    <hr> <!-- Cria uma linha divisória horizontal-->
    <p>Esse é o meu primeiro documento HTML! Estou muito feliz!</p>  <!--Corpo do texto-->
    <p>Este é um momento único, estou criando um site!</p>
</body>
</html>
