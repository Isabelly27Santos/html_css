<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listas</title>
</head>
<body>
    <h1>Trabalhando com Listas</h1>
    <h2>Listas Ordenadas</h2>
     <ol type="1" start="4"> <!--Ordened List, tem 1, a, A, i, I-->
        <li>Acordar</li> <!--li é list item -->
        <li>Arrumar a cama</li>
        <li>Tomar café</li>
        <li>Escovar os dentes</li>
        <li>Ir para faculdade</li>
        <li>Voltar pra casa</li>
        <li>Dormir</li>
    </ol>

    <h2>Lista Não Ordenadas</h2> <!--Unordered List-->
    <ul type = "circle"> <!--Tem circle, disk ou square-->
        <li>Pão</li>
        <li>Tomate</li>
        <li>Açúcar</li>
        <li>Café</li>
        <li>Arroz</li>
        <li>Leite</li>
    </ul>
</body>
</html>
